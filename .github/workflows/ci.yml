name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Lint
        run: uvx ruff check .
      - name: Install as a tool
        run: uv tool install .
      - name: Smoke test
        run: |
          tidal2garmin --help
          tidal2garmin status

<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-label="tidal2garmin: Tidal playlists on your Garmin watch">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#132a3a"/>
    </linearGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <clipPath id="face"><circle cx="230" cy="160" r="88"/></clipPath>
  </defs>

  <rect width="1280" height="320" rx="24" fill="url(#bg)"/>

  <!-- faint waves across the background -->
  <g fill="none" stroke="#38bdf8" stroke-opacity="0.08" stroke-width="2">
    <path d="M0 250 C 160 210, 320 290, 480 250 S 800 210, 960 250 S 1200 290, 1280 260"/>
    <path d="M0 275 C 160 235, 320 315, 480 275 S 800 235, 960 275 S 1200 315, 1280 285"/>
    <path d="M0 225 C 160 185, 320 265, 480 225 S 800 185, 960 225 S 1200 265, 1280 235"/>
  </g>

  <!-- watch: straps, case, bezel, buttons -->
  <rect x="180" y="20" width="100" height="70" rx="14" fill="#1e293b"/>
  <rect x="180" y="230" width="100" height="70" rx="14" fill="#1e293b"/>
  <rect x="324" y="118" width="12" height="26" rx="4" fill="#475569"/>
  <rect x="324" y="176" width="12" height="26" rx="4" fill="#475569"/>
  <rect x="124" y="118" width="12" height="26" rx="4" fill="#475569"/>
  <rect x="124" y="176" width="12" height="26" rx="4" fill="#475569"/>
  <circle cx="230" cy="160" r="108" fill="#334155"/>
  <circle cx="230" cy="160" r="98" fill="#0f172a" stroke="#64748b" stroke-width="3"/>
  <circle cx="230" cy="160" r="88" fill="#020617"/>

  <!-- face: equalizer bars + note -->
  <g clip-path="url(#face)" fill="url(#wave)">
    <rect x="172" y="150" width="12" height="40" rx="6"/>
    <rect x="192" y="122" width="12" height="68" rx="6"/>
    <rect x="212" y="138" width="12" height="52" rx="6"/>
    <rect x="232" y="108" width="12" height="82" rx="6"/>
    <rect x="252" y="130" width="12" height="60" rx="6"/>
    <rect x="272" y="146" width="12" height="44" rx="6"/>
  </g>
  <text x="230" y="222" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" fill="#94a3b8">OFFLINE</text>

  <!-- title -->
  <text x="400" y="150" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="76" font-weight="700" fill="#f8fafc">tidal<tspan fill="url(#wave)">2</tspan>garmin</text>
  <text x="404" y="205" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="28" fill="#94a3b8">Your Tidal playlists on your Garmin watch. Offline, from Linux.</text>
  <text x="404" y="252" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="22" fill="#2dd4bf">$ ./tidal2garmin.py pull Electro &amp;&amp; ./tidal2garmin.py push</text>
</svg>
